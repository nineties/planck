name: bench
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Version to measure (branch, tag or commit)
        required: true
        default: main
      rounds:
        description: Number of runs of the measured version
        required: false
        default: '5'
      pr:
        description: Open a pull request that records the result in bench/results.md
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: planck-bench
  cancel-in-progress: false
env:
  BENCH_VM: benchmark
  BENCH_ZONE: us-central1-b
  BENCH_PROJECT: personal-use-257811
jobs:
  start-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_BENCH_VM_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud compute instances start "$BENCH_VM" --zone "$BENCH_ZONE" --project "$BENCH_PROJECT"
  bench:
    needs: start-vm
    runs-on: [self-hosted, planck-bench]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo
      - name: Resolve the versions
        id: refs
        working-directory: repo
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ROUNDS: ${{ inputs.rounds }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          ref=${INPUT_REF:-$GITHUB_REF_NAME}
          commit=$(git rev-parse --verify -q "$ref^{commit}" || git rev-parse --verify -q "origin/$ref^{commit}")
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$INPUT_PR" = true ]; then record=true; else record=false; fi
          git show "$commit:bench/run.pk" > /dev/null
          {
            echo "ref=$ref"
            echo "commit=$commit"
            echo "rounds=${INPUT_ROUNDS:-5}"
            echo "record=$record"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.commit }}
          path: cur
      - name: Download the latest planck0
        run: |
          rm -f planck0 planck0.sha256 planck0.version
          gh release download --repo nineties/hex-to-compiler --pattern "planck0*"
          sha256sum -c planck0.sha256
          chmod +x planck0
          gh release view --repo nineties/hex-to-compiler --json tagName --jq .tagName > planck0.version
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        if: steps.refs.outputs.record == 'true'
        with:
          ref: main
          path: main
      - name: Measure
        env:
          REF: ${{ steps.refs.outputs.ref }}
          COMMIT: ${{ steps.refs.outputs.commit }}
          ROUNDS: ${{ steps.refs.outputs.rounds }}
          RECORD: ${{ steps.refs.outputs.record }}
        run: |
          rm -rf out
          mkdir out
          results=
          results_md=
          if [ "$RECORD" = true ]; then results=$PWD/main/bench/results.pk; results_md=$PWD/main/bench/results.md; fi
          cd cur
          ../planck0 bench/measure.pk "planck0_bin=$PWD/../planck0" "cur=$PWD" "out=$PWD/../out" "ref=$REF" "commit=$COMMIT" "planck0=$(cat ../planck0.version)" "rounds=$ROUNDS" "summary=$GITHUB_STEP_SUMMARY" "results=$results" "results_md=$results_md"
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: out
          if-no-files-found: ignore
      - name: Open a pull request that records the result
        if: steps.refs.outputs.record == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.refs.outputs.ref }}
        run: |
          cd main
          branch=bench-result-$(echo "$REF" | tr -c 'A-Za-z0-9.\n' '-')-$GITHUB_RUN_ID
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add bench/results.pk bench/results.md
          git commit -m "bench: record the result of $REF"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "bench: record the result of $REF" --body "Result of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  stop-vm:
    needs: [start-vm, bench]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_BENCH_VM_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud compute instances stop "$BENCH_VM" --zone "$BENCH_ZONE" --project "$BENCH_PROJECT"
