name: bench
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Version to measure (branch, tag or commit)
        required: true
        default: main
      rounds:
        description: Number of runs of the measured version
        required: false
        default: '5'
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: planck-bench
  cancel-in-progress: false
env:
  BENCH_VM: benchmark
  BENCH_ZONE: us-central1-b
  BENCH_PROJECT: personal-use-257811
jobs:
  start-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_BENCH_VM_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud compute instances start "$BENCH_VM" --zone "$BENCH_ZONE" --project "$BENCH_PROJECT"
  bench:
    needs: start-vm
    runs-on: [self-hosted, planck-bench]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo
      - name: Resolve the versions
        id: refs
        working-directory: repo
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ROUNDS: ${{ inputs.rounds }}
        run: |
          ref=${INPUT_REF:-$GITHUB_REF_NAME}
          commit=$(git rev-parse --verify -q "$ref^{commit}" || git rev-parse --verify -q "origin/$ref^{commit}")
          git show "$commit:bench/run.pk" > /dev/null
          {
            echo "ref=$ref"
            echo "commit=$commit"
            echo "rounds=${INPUT_ROUNDS:-5}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.commit }}
          path: cur
      - name: Download the latest planck0
        run: |
          rm -f planck0 planck0.sha256 planck0.version
          gh release download --repo nineties/hex-to-compiler --pattern "planck0*"
          sha256sum -c planck0.sha256
          chmod +x planck0
          gh release view --repo nineties/hex-to-compiler --json tagName --jq .tagName > planck0.version
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Measure
        run: |
          rm -rf out
          mkdir out
          W=$PWD
          for round in 1 2 3; do
            for c in 3a9e872 d51db6d 44a829c ed33c36 ca8e70f 0f8a49a; do
              d=$PWD/wt-$c
              [ -d "$d" ] || git -C repo worktree add --detach "$d" $c
              (cd "$d" && "$W/planck0" "$d/bench/run.pk" "$W/out/samples-$c.pk" "$(date +%s%N)") || echo "$c failed" >> out/failures.txt
            done
          done
          for c in 3a9e872 d51db6d 44a829c ed33c36 ca8e70f 0f8a49a; do
            echo "== $c"
            grep -h -E '"(gc_alloc|startup)"' "out/samples-$c.pk"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: samples
          path: out
          if-no-files-found: ignore
  stop-vm:
    needs: [start-vm, bench]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_BENCH_VM_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud compute instances stop "$BENCH_VM" --zone "$BENCH_ZONE" --project "$BENCH_PROJECT"
