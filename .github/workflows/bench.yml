name: bench
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Version to measure (branch, tag or commit)
        required: true
        default: main
      prev_ref:
        description: Version to compare with (empty means the release before the measured one)
        required: false
        default: ''
      rounds:
        description: Rounds of previous, current, current, previous runs
        required: false
        default: '3'
      pr:
        description: Open a pull request that records the result in bench/results.md
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  pull-requests: write
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo
      - name: Resolve the versions
        id: refs
        working-directory: repo
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PREV: ${{ inputs.prev_ref }}
          INPUT_ROUNDS: ${{ inputs.rounds }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          ref=${INPUT_REF:-$GITHUB_REF_NAME}
          commit=$(git rev-parse "$ref^{commit}" 2>/dev/null || git rev-parse "origin/$ref^{commit}")
          prev=$INPUT_PREV
          if [ -z "$prev" ]; then
            prev=$(git tag --merged "$commit" --sort=-v:refname | grep -vx "$ref" | head -1 || true)
          fi
          prev_commit=
          if [ -n "$prev" ]; then
            prev_commit=$(git rev-parse "$prev^{commit}" 2>/dev/null || git rev-parse "origin/$prev^{commit}")
          fi
          if [ "$prev_commit" = "$commit" ]; then
            prev=
            prev_commit=
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$INPUT_PR" = true ]; then record=true; else record=false; fi
          git show "$commit:bench/run.pk" > /dev/null
          {
            echo "ref=$ref"
            echo "commit=$commit"
            echo "prev_ref=$prev"
            echo "prev_commit=$prev_commit"
            echo "rounds=${INPUT_ROUNDS:-3}"
            echo "record=$record"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.commit }}
          path: cur
      - uses: actions/checkout@v4
        if: steps.refs.outputs.prev_commit != ''
        with:
          ref: ${{ steps.refs.outputs.prev_commit }}
          path: prev
      - name: Download the latest planck0
        run: |
          gh release download --repo nineties/hex-to-compiler --pattern "planck0*"
          sha256sum -c planck0.sha256
          chmod +x planck0
          gh release view --repo nineties/hex-to-compiler --json tagName --jq .tagName > planck0.version
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Measure
        run: |
          for round in $(seq ${{ steps.refs.outputs.rounds }}); do
            if [ -d prev ]; then (cd prev && ../planck0 ../cur/bench/run.pk ../samples-prev.pk $(cut -d' ' -f1 /proc/uptime)); fi
            (cd cur && ../planck0 bench/run.pk ../samples-cur.pk $(cut -d' ' -f1 /proc/uptime))
            (cd cur && ../planck0 bench/run.pk ../samples-cur.pk $(cut -d' ' -f1 /proc/uptime))
            if [ -d prev ]; then (cd prev && ../planck0 ../cur/bench/run.pk ../samples-prev.pk $(cut -d' ' -f1 /proc/uptime)); fi
          done
          {
            echo "ref=${{ steps.refs.outputs.ref }}"
            echo "commit=${{ steps.refs.outputs.commit }}"
            echo "prev_ref=${{ steps.refs.outputs.prev_ref }}"
            echo "prev_commit=${{ steps.refs.outputs.prev_commit }}"
            echo "planck0=$(cat planck0.version)"
            echo "nproc=$(nproc)"
            echo "cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "rounds=${{ steps.refs.outputs.rounds }}"
          } > meta.txt
      - name: Table in the run summary
        run: |
          prev_samples=-
          if [ -d prev ]; then prev_samples=../samples-prev.pk; fi
          (cd cur && ../planck0 bench/record.pk ../this-run.pk ../samples-cur.pk "$prev_samples" ../meta.txt)
          (cd cur && ../planck0 bench/report.pk ../this-run.pk ../this-run.md)
          echo "# Benchmark ${{ steps.refs.outputs.ref }} against ${{ steps.refs.outputs.prev_ref }}" >> "$GITHUB_STEP_SUMMARY"
          cat this-run.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: |
            samples-cur.pk
            samples-prev.pk
            this-run.pk
            this-run.md
          if-no-files-found: ignore
      - uses: actions/checkout@v4
        if: steps.refs.outputs.record == 'true'
        with:
          ref: main
          path: main
      - name: Open a pull request that records the result
        if: steps.refs.outputs.record == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.refs.outputs.ref }}
        run: |
          cat this-run.pk >> main/bench/results.pk
          (cd cur && ../planck0 bench/report.pk ../main/bench/results.pk ../main/bench/results.md)
          cd main
          branch=bench-result-$(echo "$REF" | tr -c 'A-Za-z0-9.\n' '-')-$GITHUB_RUN_ID
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add bench/results.pk bench/results.md
          git commit -m "bench: record the result of $REF"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "bench: record the result of $REF" --body "Result of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
